[package]
name = "ccms"
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
description = "Claude Code Model Switcher — per-tier provider routing, encrypted key pools, usage stats"
license = "MIT"
repository = "https://github.com/Madokana127/ccms"

[[bin]]
name = "ccms"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
codegen-units = 1
